<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY ARCHIVE</title><style>
:root{--bg:#0e0f13;--card:#171a22;--line:#242833;--tx:#e8e9ee;--mu:#8a8f9c;--ac:#9db4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Pretendard","Noto Sans KR",system-ui,sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 0}.w{max-width:1100px;margin:0 auto;padding:0 20px}
header a{color:var(--tx);font-weight:700;letter-spacing:.12em;text-decoration:none}
.lay{display:flex;gap:40px;padding:36px 0}aside{width:190px;flex:none}
aside a{display:block;padding:8px 14px;border-radius:8px;color:var(--tx);font-weight:600;text-decoration:none;font-size:15px}
aside a.on{background:#25272f}aside .sub a{color:var(--mu);font-weight:400;font-size:14px;padding:4px 14px 4px 24px;border-radius:0}
aside .sub a.on{background:none;color:var(--ac)}main{flex:1;min-width:0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;color:inherit;text-decoration:none}
.card h2{margin:0 0 4px;font-size:19px}.card small{color:var(--mu)}.card span{display:block;margin-top:6px;color:var(--ac);font-size:14px}
article h1{margin:0 0 4px}article .m{color:var(--mu);font-size:14px;margin-bottom:28px}
article .b{white-space:pre-wrap;font-family:"Noto Serif KR",serif;font-size:17px;line-height:2;max-width:42em}
.back{color:var(--mu);text-decoration:none;font-size:14px}
@media(max-width:720px){.lay{flex-direction:column;gap:16px}aside{width:auto}}
</style></head><body>
<header><div class="w"><a href="#/">MY ARCHIVE</a></div></header>
<div class="w lay"><aside id="side"></aside><main id="main"></main></div>
<script>
let P=[];const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc=encodeURIComponent;
fetch("data/posts.json?"+Date.now()).then(r=>r.json()).then(d=>{P=(d.posts||[]).map((p,i)=>({...p,id:i}));
P.sort((a,b)=>String(b.date).localeCompare(String(a.date)));route()}).catch(()=>$("#main").textContent="글을 불러오지 못했어요.");
addEventListener("hashchange",route);
function side(cat,ser){const cats={};P.forEach(p=>{(cats[p.category]=cats[p.category]||new Set());if(p.series)cats[p.category].add(p.series)});
let h=`<a href="#/" class="${!cat?"on":""}">전체 기록</a>`;
for(const c in cats){h+=`<a href="#/c/${enc(c)}" class="${cat==c&&!ser?"on":""}">${esc(c)}</a>`;
if(cats[c].size)h+=`<div class="sub">`+[...cats[c]].sort().map(s=>`<a href="#/c/${enc(c)}/${enc(s)}" class="${ser==s?"on":""}">${esc(s)}</a>`).join("")+`</div>`}
$("#side").innerHTML=h}
function route(){const [,t,a,b]=(location.hash||"#/").split("/").map(decodeURIComponent);window.scrollTo(0,0);
if(t=="p"){const p=P[+a]||P.find(x=>x.id==a);if(!p)return;side(p.category,p.series);
$("#main").innerHTML=`<a class="back" href="javascript:history.back()">← 목록으로</a><article><h1>${esc(p.title)}</h1><div class="m">${esc(p.date)} · ${esc(p.category)}${p.series?" / "+esc(p.series):""}</div><div class="b">${esc(p.body)}</div></article>`;return}
const cat=t=="c"?a:null,ser=t=="c"?b:null;side(cat,ser);
const L=P.filter(p=>(!cat||p.category==cat)&&(!ser||p.series==ser));
$("#main").innerHTML=L.length?L.map(p=>`<a class="card" href="#/p/${p.id}"><h2>${esc(p.title)}</h2><small>${esc(p.date)}</small><span>내용 보기</span></a>`).join(""):"<p>아직 글이 없어요.</p>"}
</script></body></html>
