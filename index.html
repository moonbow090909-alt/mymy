<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY ARCHIVE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0e0f13;--card:#171a22;--line:#242833;--tx:#e8e9ee;--mu:#8a8f9c;--ac:#9db4ff;--red:#ff4d5a;--fs:16px;--lh:1.8;--pg:.8em}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 0}.w{max-width:1100px;margin:0 auto;padding:0 20px}
header a{color:var(--tx);font-weight:700;letter-spacing:.12em;text-decoration:none}
.lay{display:flex;gap:40px;padding:36px 0}aside{width:190px;flex:none}
aside a{display:block;padding:8px 14px;border-radius:8px;color:var(--tx);font-weight:600;text-decoration:none;font-size:15px}
aside a.on{background:#25272f}aside .sub a{color:var(--mu);font-weight:400;font-size:14px;padding:4px 14px 4px 24px;border-radius:0}
aside .sub a.on{background:none;color:var(--ac)}main{flex:1;min-width:0}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:14px;color:inherit;text-decoration:none}
.card h2{margin:0 0 4px;font-size:19px}.card small{color:var(--mu)}.card span{display:block;margin-top:6px;color:var(--ac);font-size:14px}
.red{color:var(--red)}.warn{border:1px solid #5a1d22;background:#2a1013;color:#ff7a84;text-align:center;border-radius:8px;padding:12px;margin:18px 0 28px;font-size:14px}
article h1{margin:0 0 4px;font-size:26px}article .m{color:var(--mu);font-size:14px}
.tl{float:right;font-size:13px}.tl button{background:var(--card);color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;margin-left:4px}
.b{font-weight:300;font-size:var(--fs);line-height:var(--lh);max-width:40em;margin-top:24px}.b p{margin:0 0 var(--pg)}
.pn{display:flex;justify-content:space-between;max-width:40em;margin:56px 0 20px}.pn a,.back{color:var(--mu);text-decoration:none;font-size:14px}
#up{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;cursor:pointer}
@media(max-width:720px){.lay{flex-direction:column;gap:16px}aside{width:auto}}
</style></head><body>
<header><div class="w"><a href="#/">MY ARCHIVE</a></div></header>
<div class="w lay"><aside id="side"></aside><main id="main"></main></div>
<button id="up" title="맨 위로" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
let P=[],S=[];const $=s=>document.querySelector(s),enc=encodeURIComponent;
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J=u=>fetch(u+"?"+Date.now()).then(r=>r.ok?r.json():Promise.reject());
const ord=(x,y)=>(+x.order||0)-(+y.order||0)||String(x.date).localeCompare(String(y.date))||x.id-y.id;
const T=p=>(p.adult?"🔞 ":"")+p.title,cls=p=>p.adult?' class="red"':"";
try{const f=localStorage.getItem("fs");if(f)document.documentElement.style.setProperty("--fs",f+"px")}catch(e){}
function fs(d){const r=document.documentElement,n=Math.min(24,Math.max(13,parseFloat(getComputedStyle(r).getPropertyValue("--fs"))+d));r.style.setProperty("--fs",n+"px");try{localStorage.setItem("fs",n)}catch(e){}}
Promise.all([J("data/all.json").catch(()=>J("data/posts.json")),J("data/series.json").catch(()=>({series:[]}))]).then(([a,b])=>{
P=(a.posts||[]).map((p,i)=>({...p,id:i,adult:p.adult===true}));S=b.series||[];
P.sort((x,y)=>String(y.date).localeCompare(String(x.date))||x.id-y.id);route()}).catch(()=>$("#main").textContent="글을 불러오지 못했어요.");
addEventListener("hashchange",route);
function side(cat,ser){const m={};["소설","원작","끄적끄적"].forEach(c=>m[c]=new Set());
S.forEach(s=>{(m[s.category]=m[s.category]||new Set()).add(s.name)});P.forEach(p=>{(m[p.category]=m[p.category]||new Set());if(p.series)m[p.category].add(p.series)});
let h=`<a href="#/" class="${!cat?"on":""}">전체 기록</a>`;
for(const c in m){h+=`<a href="#/c/${enc(c)}" class="${cat==c&&!ser?"on":""}">${esc(c)}</a>`;
if(m[c].size&&cat==c)h+=`<div class="sub">`+[...m[c]].sort().map(s=>`<a href="#/c/${enc(c)}/${enc(s)}" class="${ser==s?"on":""}">${esc(s)}</a>`).join("")+`</div>`}
$("#side").innerHTML=h}
function route(){const [,t,a,b]=(location.hash||"#/").split("/").map(decodeURIComponent);window.scrollTo(0,0);
if(t=="p"){const p=P.find(x=>x.id==+a);if(!p)return;side(p.category,p.series);
const sib=p.series?P.filter(x=>x.series==p.series&&x.category==p.category).sort(ord):[],i=sib.indexOf(p),pv=sib[i-1],nx=sib[i+1];
const lk=x=>`#/p/${x.id}`,back=p.series?`#/c/${enc(p.category)}/${enc(p.series)}`:`#/c/${enc(p.category)}`;
const body=String(p.body||"").split(/\n\s*\n/).filter(x=>x.trim()).map(x=>`<p>${esc(x).replace(/\n/g,"<br>")}</p>`).join("");
$("#main").innerHTML=`<a class="back" href="${back}">← ${esc(p.series||p.category)}로 돌아가기</a><article><div class="tl">글자 <button onclick="fs(-1)">가-</button><button onclick="fs(1)">가+</button></div><h1${cls(p)}>${esc(T(p))}</h1><div class="m">${esc(p.date)} · ${esc(p.category)}${p.series?" / "+esc(p.series):""}</div>${p.adult?'<div class="warn">⚠️ 본 글은 성인 전용 콘텐츠를 포함하고 있습니다.</div>':""}<div class="b">${body}</div></article>
<div class="pn">${pv?`<a href="${lk(pv)}">← 이전 화</a>`:"<span></span>"}${nx?`<a href="${lk(nx)}">다음 화 →</a>`:"<span></span>"}</div><a class="back" href="${back}">← ${esc(p.series||p.category)}로 돌아가기</a>`;return}
const cat=t=="c"?a:null,ser=t=="c"?b:null;side(cat,ser);
let L=P.filter(p=>(!cat||p.category==cat)&&(!ser||p.series==ser));if(ser)L=[...L].sort(ord);
$("#main").innerHTML=L.length?L.map(p=>`<a class="card" href="#/p/${p.id}"><h2${cls(p)}>${esc(T(p))}</h2><small>${esc(p.date)}</small><span>내용 보기</span></a>`).join(""):"<p>아직 글이 없어요.</p>"}
</script></body></html>
